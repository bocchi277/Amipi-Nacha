services:
  - type: web
    name: amipi-nacha-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set your free PostgreSQL database URL (e.g. from Neon.tech or Render)
      - key: SECRET_KEY
        generateValue: true
      # Encrypts vendor routing/account numbers at rest. REQUIRED.
      # sync:false so it is set once in the dashboard and never rotated by a deploy:
      # changing this value makes existing encrypted rows unreadable until
      # scripts/rotate_encryption_key.py has run with the old key as a fallback.
      - key: BANK_DETAILS_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://amipi-nacha.netlify.app"
