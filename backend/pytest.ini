[pytest]
# Only the hermetic suite runs by default.
#
# `tests_live/` is deliberately excluded: it drives a real browser against a running
# deployment, and test_live_browser_e2e.py targets the PRODUCTION Netlify/Render
# environment. Those must be opted into explicitly, never run unattended:
#
#     pytest tests_live/test_live_ui_verification.py     # against a local server
#
testpaths = tests

# Tests declare @pytest.mark.asyncio explicitly.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

markers =
    real_auth: test performs its own authentication; suppresses the default injected
        identity. Required for any test asserting 401/403 behaviour.

filterwarnings =
    ignore::DeprecationWarning
